# MUTINY checking its own pull requests.
#
# This is also the example to copy: it is the whole integration.
name: MUTINY

on:
  pull_request:

# The token needs to write a comment and nothing else.
permissions:
  contents: read
  pull-requests: write

jobs:
  behaviour:
    runs-on: ubuntu-latest
    # A behaviour difference is information for a reviewer, not a verdict, so a
    # failure here never blocks the pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          nebius-project-id: ${{ secrets.NEBIUS_PROJECT_ID }}
