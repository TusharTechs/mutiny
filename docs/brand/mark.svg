<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="MUTINY">
  <title>MUTINY</title>
  <desc>Two versions run together, then diverge. The mark is the point where they split.</desc>
  <rect width="64" height="64" rx="14" fill="#0d1014"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#222a34" stroke-width="1.5"/>
  <g fill="none" stroke-width="4.5" stroke-linecap="round">
    <!-- one line: the code before anyone touched it -->
    <path d="M11 32 H27" stroke="#8b97a8"/>
    <!-- the same input, two answers -->
    <path d="M27 32 C36 32 36 17 52 17" stroke="#4ecdc4"/>
    <path d="M27 32 C36 32 36 47 52 47" stroke="#e56a6a"/>
  </g>
  <!-- the witness: the input where they stop agreeing -->
  <circle cx="27" cy="32" r="6.5" fill="#0d1014"/>
  <circle cx="27" cy="32" r="4" fill="#e3e8ef"/>
</svg>
