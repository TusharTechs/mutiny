[project]
name = "mutiny"
version = "0.1.0"
description = "Differential verification for AI-written code: run both versions, find the input where they disagree."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tushar Agarwal" }]
dependencies = [
    "pytest>=8.0",
    "openai>=1.40",
    # The orchestrator reads the target's coverage database to find which tests
    # execute a mutated line; pytest-cov is installed into the target, not here.
    "coverage>=7.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mutiny = "mutiny.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mutiny"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures holds sample repositories that MUTINY operates on. They are
# data, not our test suite: collecting them would run someone else's tests and
# break the moment a mutation is applied mid-run.
norecursedirs = ["tests/fixtures", ".venv", "experiments/*/checkouts"]
