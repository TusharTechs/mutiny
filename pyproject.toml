[project]
name = "mutiny"
version = "0.1.0"
description = "Differential verification for AI-written code: run both versions, find the input where they disagree."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Tushar Agarwal" }]
# What MUTINY needs to run, including as a deployment. Vercel reads
# dependencies from this file as readily as from requirements.txt, so anything
# missing here is a build that fails in production and nowhere else.
dependencies = [
    "openai>=1.40",
    # sandbox.py imports this; it was missing, which made the package
    # installable and broken.
    "contree-sdk>=0.3",
    "fastapi>=0.115",
]

[project.optional-dependencies]
# pytest and coverage run against the code under test, inside the sandbox --
# not here. They are needed to run MUTINY's own suite.
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0", "coverage>=7.4"]
web = ["uvicorn[standard]>=0.32"]

[tool.vercel]
entrypoint = "main:app"

[project.scripts]
mutiny = "mutiny.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mutiny"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/fixtures holds sample repositories that MUTINY operates on. They are
# data, not our test suite: collecting them would run someone else's tests and
# break the moment a mutation is applied mid-run.
norecursedirs = ["tests/fixtures", ".venv", "experiments/*/checkouts"]
