[project]
name = "mutiny"
version = "0.1.0"
description = "Adversarial verification for AI-written code: attack the diff, prove the blind spot."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pytest>=8.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mutiny"]

[tool.pytest.ini_options]
testpaths = ["tests"]
